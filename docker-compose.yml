services:
  planner:
    image: ghcr.io/olidunham/christmas-dinner-planner:latest
    container_name: christmas-planner
    restart: unless-stopped
    ports:
      - "3000:3000"   # host:container. Change the left number to use another port
    volumes:
      - ./data:/data
    environment:
      TZ: Europe/London
    labels:
      # Opt this container in to automatic updates. The shared Watchtower (see infra/watchtower)
      # only touches containers with this label.
      com.centurylinklabs.watchtower.enable: "true"
