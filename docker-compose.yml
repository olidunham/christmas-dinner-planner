services:
  planner:
    image: ghcr.io/olidunham/christmas-dinner-planner:latest
    container_name: christmas-planner
    restart: unless-stopped
    ports:
      - "3000:3000"   # host:container. Change the left number to use another port
    volumes:
      - ./data:/data
    environment:
      TZ: Europe/London
    labels:
      # Opt this container in to automatic updates (Watchtower only touches labelled containers).
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    # Maintained fork of the archived containrrr/watchtower. Docker Hub: nickfedor/watchtower
    image: nickfedor/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      # Lets Watchtower talk to Docker so it can pull images and recreate containers.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Europe/London
      WATCHTOWER_POLL_INTERVAL: "300"   # check for a new image every 5 minutes (seconds)
      WATCHTOWER_LABEL_ENABLE: "true"   # only update containers labelled as above
      WATCHTOWER_CLEANUP: "true"        # delete the old image after updating
